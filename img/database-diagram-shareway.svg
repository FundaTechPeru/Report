<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .ctx { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 14; }
      .ctx2 { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
      .ctx3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .ctx4 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .table { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .head { fill: #1e293b; }
      .headText { fill: #ffffff; font: 700 15px Arial, sans-serif; }
      .txt { fill: #0f172a; font: 12px Arial, sans-serif; }
      .small { fill: #475569; font: 11px Arial, sans-serif; }
      .ctxText { fill: #1e293b; font: 700 18px Arial, sans-serif; }
      .rel { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1120"/>
  <text x="800" y="42" text-anchor="middle" style="fill:#0f172a;font:700 28px Arial,sans-serif">ShareWay - Relational Database Diagram</text>
  <text x="800" y="68" text-anchor="middle" style="fill:#475569;font:14px Arial,sans-serif">Modelo lógico propuesto para persistencia por bounded context</text>

  <rect class="ctx" x="40" y="100" width="360" height="410"/>
  <text class="ctxText" x="60" y="130">Identity &amp; Driver Verification</text>

  <rect class="table" x="65" y="155" width="310" height="95"/>
  <rect class="head" x="65" y="155" width="310" height="28"/>
  <text class="headText" x="80" y="174">usuarios</text>
  <text class="txt" x="80" y="201">PK usuario_id</text>
  <text class="txt" x="80" y="219">nombre, email UQ, telefono</text>
  <text class="txt" x="80" y="237">rol, estado, created_at</text>

  <rect class="table" x="65" y="270" width="310" height="92"/>
  <rect class="head" x="65" y="270" width="310" height="28"/>
  <text class="headText" x="80" y="289">vehiculos</text>
  <text class="txt" x="80" y="316">PK vehiculo_id</text>
  <text class="txt" x="80" y="334">FK conductor_id -> usuarios</text>
  <text class="txt" x="80" y="352">placa UQ, marca, modelo, asientos</text>

  <rect class="table" x="65" y="382" width="310" height="98"/>
  <rect class="head" x="65" y="382" width="310" height="28"/>
  <text class="headText" x="80" y="401">documentos_conductor</text>
  <text class="txt" x="80" y="428">PK documento_id</text>
  <text class="txt" x="80" y="446">FK conductor_id -> usuarios</text>
  <text class="txt" x="80" y="464">tipo, url_archivo, estado, motivo_rechazo</text>

  <rect class="ctx2" x="430" y="100" width="520" height="540"/>
  <text class="ctxText" x="450" y="130">Ride Booking &amp; Matching</text>

  <rect class="table" x="455" y="155" width="220" height="105"/>
  <rect class="head" x="455" y="155" width="220" height="28"/>
  <text class="headText" x="470" y="174">solicitudes_viaje</text>
  <text class="txt" x="470" y="201">PK solicitud_id</text>
  <text class="txt" x="470" y="219">FK pasajero_id -> usuarios</text>
  <text class="txt" x="470" y="237">origen, destino, fecha, estado</text>

  <rect class="table" x="705" y="155" width="220" height="105"/>
  <rect class="head" x="705" y="155" width="220" height="28"/>
  <text class="headText" x="720" y="174">grupos_viaje</text>
  <text class="txt" x="720" y="201">PK grupo_id</text>
  <text class="txt" x="720" y="219">capacidad, minimo_pasajeros</text>
  <text class="txt" x="720" y="237">estado, cupos_disponibles</text>

  <rect class="table" x="455" y="295" width="220" height="115"/>
  <rect class="head" x="455" y="295" width="220" height="28"/>
  <text class="headText" x="470" y="314">reservas</text>
  <text class="txt" x="470" y="341">PK reserva_id</text>
  <text class="txt" x="470" y="359">FK solicitud_id -> solicitudes_viaje</text>
  <text class="txt" x="470" y="377">FK grupo_id -> grupos_viaje</text>
  <text class="txt" x="470" y="395">estado, pin_hash, version</text>

  <rect class="table" x="705" y="295" width="220" height="115"/>
  <rect class="head" x="705" y="295" width="220" height="28"/>
  <text class="headText" x="720" y="314">viajes_recurrentes</text>
  <text class="txt" x="720" y="341">PK recurrente_id</text>
  <text class="txt" x="720" y="359">FK pasajero_id -> usuarios</text>
  <text class="txt" x="720" y="377">origen, destino, dias_semana</text>
  <text class="txt" x="720" y="395">hora_preferida, estado</text>

  <rect class="table" x="455" y="445" width="220" height="115"/>
  <rect class="head" x="455" y="445" width="220" height="28"/>
  <text class="headText" x="470" y="464">propuestas_viaje</text>
  <text class="txt" x="470" y="491">PK propuesta_id</text>
  <text class="txt" x="470" y="509">FK grupo_id -> grupos_viaje</text>
  <text class="txt" x="470" y="527">FK conductor_id -> usuarios</text>
  <text class="txt" x="470" y="545">ganancia_estimada, estado, expira_at</text>

  <rect class="table" x="705" y="445" width="220" height="115"/>
  <rect class="head" x="705" y="445" width="220" height="28"/>
  <text class="headText" x="720" y="464">disponibilidades</text>
  <text class="txt" x="720" y="491">PK disponibilidad_id</text>
  <text class="txt" x="720" y="509">FK conductor_id -> usuarios</text>
  <text class="txt" x="720" y="527">dia_semana, hora_inicio, hora_fin</text>
  <text class="txt" x="720" y="545">zona_operacion, estado</text>

  <rect class="ctx3" x="980" y="100" width="560" height="540"/>
  <text class="ctxText" x="1000" y="130">Trip Execution, Routing &amp; Notifications</text>

  <rect class="table" x="1005" y="155" width="235" height="105"/>
  <rect class="head" x="1005" y="155" width="235" height="28"/>
  <text class="headText" x="1020" y="174">rutas</text>
  <text class="txt" x="1020" y="201">PK ruta_id</text>
  <text class="txt" x="1020" y="219">FK grupo_id -> grupos_viaje</text>
  <text class="txt" x="1020" y="237">distancia_km, duracion_estimada</text>

  <rect class="table" x="1275" y="155" width="235" height="105"/>
  <rect class="head" x="1275" y="155" width="235" height="28"/>
  <text class="headText" x="1290" y="174">paradas</text>
  <text class="txt" x="1290" y="201">PK parada_id</text>
  <text class="txt" x="1290" y="219">FK ruta_id -> rutas</text>
  <text class="txt" x="1290" y="237">orden, tipo, latitud, longitud</text>

  <rect class="table" x="1005" y="295" width="235" height="115"/>
  <rect class="head" x="1005" y="295" width="235" height="28"/>
  <text class="headText" x="1020" y="314">viajes</text>
  <text class="txt" x="1020" y="341">PK viaje_id</text>
  <text class="txt" x="1020" y="359">FK grupo_id -> grupos_viaje</text>
  <text class="txt" x="1020" y="377">FK conductor_id -> usuarios</text>
  <text class="txt" x="1020" y="395">estado, inicio_at, fin_at</text>

  <rect class="table" x="1275" y="295" width="235" height="115"/>
  <rect class="head" x="1275" y="295" width="235" height="28"/>
  <text class="headText" x="1290" y="314">validaciones_abordaje</text>
  <text class="txt" x="1290" y="341">PK validacion_id</text>
  <text class="txt" x="1290" y="359">FK reserva_id -> reservas</text>
  <text class="txt" x="1290" y="377">FK viaje_id -> viajes</text>
  <text class="txt" x="1290" y="395">intentos_fallidos, validado_at</text>

  <rect class="table" x="1005" y="445" width="235" height="115"/>
  <rect class="head" x="1005" y="445" width="235" height="28"/>
  <text class="headText" x="1020" y="464">notificaciones</text>
  <text class="txt" x="1020" y="491">PK notificacion_id</text>
  <text class="txt" x="1020" y="509">FK usuario_id -> usuarios</text>
  <text class="txt" x="1020" y="527">canal, prioridad, estado</text>
  <text class="txt" x="1020" y="545">payload, reintentos, created_at</text>

  <rect class="ctx4" x="40" y="680" width="730" height="360"/>
  <text class="ctxText" x="60" y="710">Safety, Trust, Reputation &amp; Payments</text>

  <rect class="table" x="65" y="735" width="220" height="105"/>
  <rect class="head" x="65" y="735" width="220" height="28"/>
  <text class="headText" x="80" y="754">ubicaciones_compartidas</text>
  <text class="txt" x="80" y="781">PK ubicacion_compartida_id</text>
  <text class="txt" x="80" y="799">FK viaje_id -> viajes</text>
  <text class="txt" x="80" y="817">token_hash, expira_at, revocada_at</text>

  <rect class="table" x="315" y="735" width="205" height="105"/>
  <rect class="head" x="315" y="735" width="205" height="28"/>
  <text class="headText" x="330" y="754">alertas_emergencia</text>
  <text class="txt" x="330" y="781">PK alerta_id</text>
  <text class="txt" x="330" y="799">FK viaje_id -> viajes</text>
  <text class="txt" x="330" y="817">tipo, estado, created_at</text>

  <rect class="table" x="550" y="735" width="195" height="105"/>
  <rect class="head" x="550" y="735" width="195" height="28"/>
  <text class="headText" x="565" y="754">pagos</text>
  <text class="txt" x="565" y="781">PK pago_id</text>
  <text class="txt" x="565" y="799">FK reserva_id -> reservas</text>
  <text class="txt" x="565" y="817">monto, estado, proveedor_ref</text>

  <rect class="table" x="65" y="875" width="220" height="105"/>
  <rect class="head" x="65" y="875" width="220" height="28"/>
  <text class="headText" x="80" y="894">calificaciones</text>
  <text class="txt" x="80" y="921">PK calificacion_id</text>
  <text class="txt" x="80" y="939">FK viaje_id -> viajes</text>
  <text class="txt" x="80" y="957">evaluador_id, evaluado_id, puntaje</text>

  <rect class="table" x="315" y="875" width="205" height="105"/>
  <rect class="head" x="315" y="875" width="205" height="28"/>
  <text class="headText" x="330" y="894">tarifas</text>
  <text class="txt" x="330" y="921">PK tarifa_id</text>
  <text class="txt" x="330" y="939">FK grupo_id -> grupos_viaje</text>
  <text class="txt" x="330" y="957">base, comision, version_regla</text>

  <rect class="table" x="550" y="875" width="195" height="105"/>
  <rect class="head" x="550" y="875" width="195" height="28"/>
  <text class="headText" x="565" y="894">liquidaciones_conductor</text>
  <text class="txt" x="565" y="921">PK liquidacion_id</text>
  <text class="txt" x="565" y="939">FK viaje_id -> viajes</text>
  <text class="txt" x="565" y="957">bruto, comision, neto, estado</text>

  <path class="rel" d="M375 315 C420 315 420 205 455 205"/>
  <path class="rel" d="M675 205 L705 205"/>
  <path class="rel" d="M565 260 L565 295"/>
  <path class="rel" d="M815 260 L815 295"/>
  <path class="rel" d="M925 205 C965 205 965 205 1005 205"/>
  <path class="rel" d="M1240 205 L1275 205"/>
  <path class="rel" d="M815 260 C880 320 940 345 1005 350"/>
  <path class="rel" d="M675 350 C870 350 950 350 1005 350"/>
  <path class="rel" d="M1240 350 L1275 350"/>
  <path class="rel" d="M1122 410 C1122 620 175 620 175 735"/>
  <path class="rel" d="M1122 410 C1122 620 417 620 417 735"/>
  <path class="rel" d="M565 410 C565 640 647 640 647 735"/>
  <path class="rel" d="M565 410 C565 670 417 700 417 875"/>
  <path class="rel" d="M1122 410 C1122 690 647 720 647 875"/>
</svg>
